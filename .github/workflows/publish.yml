name: Publish to npm

# Manual only. Publishing is a deliberate act, so this never fires on push.
#
# Auth: NPM_TOKEN (a granular access token with "read and write" for this
# package, stored as a repository secret).
#
# Why not OIDC trusted publishing? npm only lets you configure a trusted
# publisher on a package that already exists — and for a package that has never
# been published there is no settings page to configure. So the *first* release
# has to go out with a token. Once the package exists:
#   npmjs.com → the package → Settings → Trusted Publishing → add this repo and
#   this workflow file. After that the token is optional; v2 can switch to OIDC
#   (permissions: id-token: write; npm publish --provenance) and the secret can
#   be deleted.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify only, do not publish"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: ${{ inputs.dry_run && 'dry run' || 'publish' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Gates (same as CI)
        run: |
          npm run check
          npm run check-paths
          npm run check-manifest
          npm run scan-secrets

      - name: Verify the tarball actually contains the plugin
        # The lockfile is easy to lose here: npm refuses to publish a root
        # package-lock.json, so it lives as npm-shrinkwrap.json and has to be
        # listed in `files` explicitly. Without it the npx installer cannot run
        # npm ci, so check rather than assume.
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          for f in npm-shrinkwrap.json herdr-plugin.toml installer.mjs bin/herdr-dingtalk-omo-bridge.mjs; do
            grep -q "$f" /tmp/pack.txt || { echo "::error::$f missing from the tarball"; exit 1; }
          done

      - name: Check the version is not already published
        run: |
          version=$(node -p "require('./package.json').version")
          published=$(npm view "herdr-dingtalk-omo-bridge@$version" version 2>/dev/null || true)
          if [ -n "$published" ]; then
            echo "::error::version $version is already on npm — bump package.json first"
            exit 1
          fi

      - name: Check the token secret exists
        # Fail with the actual reason instead of npm's E401 one step later.
        if: ${{ !inputs.dry_run }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::repository secret NPM_TOKEN is not set (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "NPM_TOKEN is present (${#NPM_TOKEN} chars)"

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
