name: Publish to npm

# Manual only. Publishing is a deliberate act, so this never fires on push.
#
# Auth and publishing model:
#
# `npm stage publish`, not `npm publish`. This account has 2FA enabled, and npm
# is winding down tokens that bypass it, so a token can no longer publish
# directly — it returns 403. Staging does not need proof-of-presence; it uploads
# the tarball to a queue. A maintainer then approves it on npmjs.com (or with
# `npm stage approve <id> --otp <code>`), and only then is it installable.
#
# Consequence worth knowing: CI can therefore run unattended, but a release is
# not live until someone approves it. `npm view <pkg>@<version>` keeps returning
# 404 until that happens.
#
# OIDC trusted publishing is deliberately not used yet: npm only lets you attach
# a trusted publisher to a package that already exists, and this one had never
# been published. Once it exists, add one on npmjs.com (package → Settings →
# Trusted Publishing, limited to this workflow) and the token can go away.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify only, do not stage"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: ${{ inputs.dry_run && 'dry run' || 'stage for approval' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Gates (same as CI)
        run: |
          npm run check
          npm run check-messages
          npm run check-paths
          npm run check-manifest
          npm run scan-secrets

      - name: Verify the tarball actually contains the plugin
        # The lockfile is easy to lose here: npm refuses to publish a root
        # package-lock.json, so it lives as npm-shrinkwrap.json and has to be
        # listed in `files` explicitly. Without it the npx installer cannot run
        # npm ci, so check rather than assume.
        run: |
          # Default Linux shell is `bash -e` without pipefail, so a failing
          # `npm pack` would be masked by `tee`'s exit status and the grep loop
          # below would report a missing file instead of the real pack error.
          set -o pipefail
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          for f in npm-shrinkwrap.json herdr-plugin.toml installer.mjs bin/herdr-dingtalk-omo-bridge.mjs image-out.mjs; do
            grep -q "$f" /tmp/pack.txt || { echo "::error::$f missing from the tarball"; exit 1; }
          done

      - name: Check the version is not already published
        run: |
          version=$(node -p "require('./package.json').version")
          published=$(npm view "herdr-dingtalk-omo-bridge@$version" version 2>/dev/null || true)
          if [ -n "$published" ]; then
            echo "::error::version $version is already on npm — bump package.json first"
            exit 1
          fi

      - name: Check the token secret exists
        # Fail with the actual reason instead of npm's E401 one step later.
        if: ${{ !inputs.dry_run }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::repository secret NPM_TOKEN is not set (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "NPM_TOKEN is present (${#NPM_TOKEN} chars)"

      - name: Stage for approval
        if: ${{ !inputs.dry_run }}
        # Both names are set on purpose. The project .npmrc refers to
        # ${NPM_TOKEN} and outranks setup-node's user-level config, so an unset
        # NPM_TOKEN would shadow the working credential with an empty one.
        # NODE_AUTH_TOKEN is what setup-node's generated .npmrc expects.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm stage publish --access public
          echo ""
          echo "Staged, not live. Approve it with 2FA to publish:"
          echo "  npm stage list"
          echo "  npm stage approve <stage-id> --otp <code>"
          echo "  — or on npmjs.com, which handles the 2FA prompt in the browser."
