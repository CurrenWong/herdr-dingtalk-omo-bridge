name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The plugin is only end-to-end verified on Windows (see README
        # "Known limitations"). The other two run the portable surface — build,
        # syntax, path resolution, secret scanning — so the code cannot
        # quietly acquire a Windows-only assumption again.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Same command the manifest's [[build]] runs at install time.
      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Syntax-check every shipped script
        run: npm run check

      # `t()` throws on an unknown key rather than printing undefined, so a
      # message translated in one language and not the other takes out a whole
      # turn at runtime. Nothing caught that locally before a user did.
      - name: Every message exists in every language
        run: npm run check-messages

      - name: Config/state paths are platform-correct
        run: node .github/scripts/check-paths.mjs

      - name: No secrets or forbidden paths committed
        run: node .github/scripts/scan-secrets.mjs .

  manifest:
    name: manifest sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # A manifest that disagrees with the code defaults would send the bridge
      # to the wrong state directory, and nothing local would catch it without
      # Herdr installed.
      - name: Manifest matches the code defaults
        run: node .github/scripts/check-manifest.mjs
