name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The plugin is only end-to-end verified on Windows (see README
        # "Known limitations"). The other two run the portable surface — build,
        # syntax, path resolution, secret scanning — so the code cannot
        # quietly acquire a Windows-only assumption again.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Same command the manifest's [[build]] runs at install time.
      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Syntax-check every shipped script
        run: npm run check

      - name: Config/state paths are platform-correct
        run: node .github/scripts/check-paths.mjs

      - name: No secrets or forbidden paths committed
        run: node .github/scripts/scan-secrets.mjs .

  manifest:
    name: manifest sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # A bad manifest is the one failure mode that cannot be caught locally
      # without Herdr installed, so at least keep it parseable and consistent.
      - name: Manifest declares the same id the code defaults to
        run: |
          manifest_id=$(grep -oP '(?<=^id = ")[^"]+' herdr-plugin.toml)
          code_id=$(grep -oP '(?<=DEFAULT_PLUGIN_ID = ")[^"]+' herdr-paths.mjs)
          echo "manifest: $manifest_id"
          echo "code:     $code_id"
          test "$manifest_id" = "$code_id" || {
            echo "::error::plugin id mismatch between herdr-plugin.toml and herdr-paths.mjs"
            exit 1
          }
